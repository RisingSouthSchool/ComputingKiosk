// file: main.ms
function()
init = function()
  crab_x = 0
  crab_y = -75
  score = 0
  coin_x = 95
  coin_y = 95
  coin_speed = 2
  ring_x = -30
  ring_y = 300
  ring_speed = 2.5
  crown_x = 70
  crown_y = 250
  crown_speed = 3
  rocks_x = -70
  rocks_y = 150
  rocks_speed = 2.5
  trash_x = -100
  trash_y = 200
  trash_speed = 3
  timer = 20 
  mode = "play"
end

update = function()
  if keyboard.LEFT then
    crab_x -= 3
  end
  if keyboard.RIGHT then
    crab_x += 3
  end
  coin_y -= coin_speed
  if coin_y < -150 then
    coin_y = 120
  end
  gapx = crab_x - coin_x
  gapy = crab_y - coin_y
  if gapx*gapx + gapy*gapy < 100 then
    score += 1
    coin_x = random.nextInt(400) - 200
    coin_y = 120
  end
  ring_y -= ring_speed
  if ring_y < -150 then
    ring_y = 120
  end
  disx = crab_x - ring_x
  disy = crab_y - ring_y
  if disx*disx + disy*disy < 100 then
    score += 1
    ring_x = random.nextInt(400) - 200
    ring_y = 120
  end
  crown_y -= crown_speed
  if crown_y < -150 then
    crown_y = 120
  end
  spacex = crab_x - crown_x
  spacey = crab_y - crown_y
  if spacex*spacex + spacey*spacey < 100 then
    score += 1
    crown_x = random.nextInt(400) - 200
    crown_y = 120
  end
  rocks_y -= rocks_speed
  if rocks_y < -150 then
    rocks_y = 120
  end
  dx = crab_x - rocks_x 
  dy = crab_y - rocks_y
  if dx*dx + dy*dy < 150 then
    score -= 1 
    rocks_x = random.nextInt(400) - 200
    rocks_y = 120
  end
  trash_y -= trash_speed
  if trash_y < -150 then
    trash_y = 120
  end
  gx = crab_x - trash_x
  gy = crab_y - trash_y
  if gx*gx + gy*gy < 150 then
    score -= 1
    trash_x = random.nextInt(400) - 200
    trash_y = 120
  end
  if score < 0 then
    score = 0
end
if timer > 0 then
  timer -= 1/60
    else
   if timer -= 0 then
    mode = "game over"
    if keyboard.SPACE then
      timer = 20
      mode = "play"
      score = 0
    end
    if mode == "game over" then
      coin_speed = 0
      crown_speed = 0
      rocks_speed = 0
      trash_speed = 0
      ring_speed = 0
      end
    if keyboard.SPACE then 
      coin_speed = 2
      crown_speed = 3
      rocks_speed = 2.5
      trash_speed = 3
      ring_speed = 2.5
      end
end
end
end

draw = function()
  screen.drawSprite("background", 0, 0 screen.width, screen.height)
  screen.drawSprite("crab", crab_x, crab_-75, 60, 60)
  screen.drawText("Score: " + score, -85,75,22 "rgb(0,0,0)")
  screen.drawSprite("coin", coin_x, coin_y, 30, 30)
  screen.drawSprite("ring", ring_x, ring_y, 35, 35)
  screen.drawSprite("crown", crown_x, crown_y, 30,30)
  screen.drawSprite("rocks", rocks_x, rocks_y, 35,35)
  screen.drawSprite("trash", trash_x, trash_y, 25,25)
  if mode == "play" then
  screen.drawText("Remaining Time: " + round(timer), 60, 75,22)
  else
    if mode == "game over" then
    screen.drawText("TIME OVER. SCORE: " + score, 0, 0, 30 "rgb(0,0,0)")
    screen.drawText("press space to restart", 0,-20,20 "rgb(0,0,0)")
    screen.drawText("Remaining Time: " + round(timer), 60, 75,22)
end
end
end

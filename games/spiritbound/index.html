// file: 0_main.ms
function()
musicStarted = 0
star_x = []
star_y = []
star_t = []

for i=0 to 15
  star_x.push(random.next()*screen.width - screen.width/2)
  star_y.push(random.next()*screen.height - screen.height/2)
  star_t.push(random.next()*1)
end

init = function()
  gameover = 0
  running = 0
  slimes = [200,300,400]
  passed = [0,0,0]
  score = 0
  position = 0
  speed = 2

  leaf_x = []
  leaf_y = []
  leaf_speed = []

  for i=0 to 4
    leaf_x.push(random.next()*200)
    leaf_y.push(random.next()*200-100)
    leaf_speed.push(0.3 + random.next()*0.5)
  end
end

update = function()
if not musicStarted then
  audio.playMusic("music")
  musicStarted = 1
end

  for i=0 to leaf_x.length-1
    leaf_y[i] -= leaf_speed[i]

    if leaf_y[i] < -120 then
      leaf_y[i] = 120
      leaf_x[i] = random.next()*200
    end
  end

  for i=0 to star_x.length-1
    star_t[i] += 0.005
    if star_t[i] > 1 then star_t[i] = 0 end
  end


  if gameover then
    gameover += 1
    if gameover>300 then init() end

  elsif running then
    position = position+speed
    speed = speed + 0.001

    if touch.touching and player_y == 0 then
      player_vy = 7
    end

    player_vy -= 0.3
    player_y = max(0,player_y+player_vy)

    for i=0 to slimes.length-1
      if slimes[i]<position-120 then
        slimes[i] = position+280+random.next()*200
        passed[i] = 0
      end

      if abs(position-slimes[i])<10 then
        if player_y<10 then
          running = 0
          gameover = 1

        elsif not passed[i] then
          passed[i] = 1
          score += 1
        end
      end
    end

  else
    if touch.touching then running = 1 end
  end
end


draw = function()
  screen.drawSprite("bg",0,0,screen.width,screen.height)

  for i=0 to star_x.length-1
    screen.drawSprite("star", star_x[i], star_y[i], 3 + star_t[i]*2)
  end

  for i=0 to leaf_x.length-1
    screen.drawSprite("leaf",leaf_x[i]-100,leaf_y[i],12)
  end

  for i=-6 to 6 by 1
    screen.drawSprite("wall",i*40-position%40,-80,40)
  end

  screen.drawSprite("player",-80,-50+player_y,20)

  for i=0 to slimes.length-1
    screen.drawSprite("slime",slimes[i]-position-80,-50,20)
  end

  screen.drawText(score,120,80,20,"#FFF")

  if gameover then
    screen.fillRect(0,0,screen.width,screen.height,"rgba(255,0,0,.5)")
    screen.drawText("GAME OVER",0,30,50,"#FFF")

  elsif not running then
    screen.drawText("READY?",0,30,50,"#FFF")
  end
end
end()

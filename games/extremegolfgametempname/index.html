// file: main.ms
function()
init = function()
  
  // ball variables
  ball = object
    x = 0
    y = -50
    vx = 0
    vy = 0
    h = 8
    w = 8
  end
 
  // velocity related variables
  friction = 0.95
  angle = 90
  power = 1
  
  // flags
  ismoving = false
  
  // golf scores and stuff
  hole = 0
  strokes = 0
  total_strokes = 0
  
  // power changing colors
  power_r = 0
  power_g = 255

end

update = function()
  
  // get current map
  local currentMap = maps["hole_" + hole]
  
  if not currentMap then return end
  
  // calculate exact tile sizes based on screen scaling
  local tw = screen.width / currentMap.width
  local th = screen.height / currentMap.height
  
  // stop ball from moving and applying physics before the ball had stopped
  if not ismoving then
    
    // the xy before shoot
    preshoot_X = ball.x
    preshoot_Y = ball.y
    
    // aiming
    if keyboard.LEFT then angle += 3 end  
    if keyboard.RIGHT then angle -= 3 end
      
    // applies a wraparound for the angle
    if angle < 0 then angle += 360 end
    if angle >= 360 then angle -= 360 end
    
    // power adjustment
    if keyboard.UP then power += 1 end
    if keyboard.DOWN then power -= 1 end
    
    // caps power to min 1, max 15
    if power < 1 then power = 1 end 
    if power > 15 then power = 15 end
    
    // changes the color of the power text to reflect the power level
    this.power_r = floor((power/15) * 255)
    this.power_g = floor(255 - ((power / 15) * 255))
    
    // shooting
    // used ai for the formula
    if keyboard.SPACE then
      strokes += 1
      total_strokes += 1
      ball.vx = cosd(angle) * power
      ball.vy = sind(angle) * power
      ismoving = true
    end
  
  else
   
    // stores the balls last position
    local oldX = ball.x
    local oldY = ball.y
    
    // movement physics
    ball.x += ball.vx
    ball.y += ball.vy
    
    // the tile positions relative to the map
    // used ai to debug
    local tileX = floor(ball.x / tw + currentMap.width / 2)
    local tileY = floor(ball.y / th + currentMap.height / 2)
    
    // set tile to a string
    local tile = ""
    
    // safely parse tile boundaries
    if tileX >= 0 and tileX < currentMap.width and tileY >= 0 and tileY < currentMap.height then
      tile = currentMap.get(tileX, tileY)
    end

    // checks if the ball it hitting a wall and applies a rebound effect
    if tile == "wall" or tile == "wall_concept" then
      ball.vx = -ball.vx * 0.7
      ball.vy = -ball.vy * 0.7

      // snaps the ball out of the tile to the last safe position
      ball.x = oldX
      ball.y = oldY
    end
  
    // collisions with flag hole and reseting
    if tile == "flag_hole" then
      hole += 1
      power = 1
      angle = 90
      ball.vx = 0
      ball.xy = 0
      ismoving = false
      strokes = 0
      
      // changes the balls location to the right starting position
      if hole == 1 then
        ball.x = 0
        ball.y = -80
      end
      
      if hole == 2 then
        ball.x = -53
        ball.y = -75
      end
      
      if hole == 3 then
        ball.x = 125
        ball.y = -75
      end
      
      if hole == 4 then
        ball.x = -25
        ball.y = -80
      end
    
      if hole == 5 then
        ball.x = -150
        ball.y = 10
      end
      
      if hole == 6 then
        ball.x = -106
        ball.y = -81
      end
      
      if hole == 7 then
        ball.x = -160
        ball.y = -81
      end
      
      if hole == 8 then
        ball.x = 115
        ball.y = -81
      end
      
      if hole == 9 then
        ball.x = -156
        ball.y = -81
      end
      
      end
      
    // changes friction depedning on the surface (grass or sand)
    if tile == "sand" then friction = 0.8 end
    
    if tile == "grass" then friction = 0.95 end
    
    // sends you back 
    if tile == "water" then
      ball.vx = 0
      ball.vy = 0
      ball.x = preshoot_X
      ball.y = preshoot_Y
    end
    
 
    // applies friction to the balls velocity variables.
    ball.vx *= friction
    ball.vy *= friction
    
    // stops ball when the velocity is too low
    if abs(ball.vx) < 0.05 and abs(ball.vy) < 0.05 then
      ball.vx = 0
      ball.vy = 0
      ismoving = false
      power = 1 // reset power for the next shot
    end
  end
end

draw = function()
  
  if hole < 10 then
  // clears screen
  screen.clear()
  
  // draws current map scaled cleanly to match window dimensions
  screen.drawMap("hole_" + hole, 0, 0, screen.width, screen.height)
   
  // draw golf ball
  screen.drawSprite("golf_ball", ball.x, ball.y, ball.w, ball.h)
  
  // draws strokes, power and angle text on screen and background
  screen.fillRect(-177, 92, 100, 24, "rgb(0,0,0)")
  screen.drawText("angle:" + angle, -190, 95, 12, "rgb(256,256,256)")
  screen.drawText("power:" + power, -148, 95, 12, "rgb(" + this.power_r + "," + this.power_g + ",0)")
  screen.drawText("strokes:" + strokes, -190, 85, 9, "rgb(256,256,256)")
  
  // shows you what to do
  if hole == 0 then
    screen.drawText("Score in the hole to start the game!", 10, -15, 16, "white")
    screen.drawText("Total strokes are only shown at the end", 10, -25, 16, "white")
  end
  
  else
    screen.clear()
    screen.drawText("You win!!!", 0, 0, 50, "rgb(256,256,256)")
    screen.drawText("Total Strokes:" + total_strokes, 0, 0, 50, "rgb(256,256,256)")
  end
  
end
end()

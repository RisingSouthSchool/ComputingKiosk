function()
init = function()

score = 0

item_y = 100
item_speed = 2
item2_x = random.nextInt(160) - 80
item2_y = 40

update = function()
  if keyboard.LEFT then 
    player_x -= 3
  end 
  if keyboard.RIGHT then 
    player_x -= -3
  end
  if alive == false then 
    return 
  end
  item_y -= item_speed

end

dy = player_y - haz_y

if dx*dx + dy*dy < 250 then 
  lives -=1 
  haz_x = random.nextInt(160) - 80
  haz_y = 100
  end

if lives <= 0 then
  alive = false
  end
end

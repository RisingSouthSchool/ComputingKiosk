        function spawnZombie(isBoss = false, isPinkBoss = false, isExplosiveBoss = false) {
            if (zombies.length >= MAX_ZOMBIES) return;

            const rand = Math.random();
            const isRanged = !isBoss && rand < 0.2; // 20% chance to be ranged
            const isCrawler = !isBoss && rand >= 0.2 && rand < 0.4; // 20% chance to be Crawler
            const isVolatile = !isBoss && rand >= 0.4 && rand < 0.5; // 10% chance to be Volatile
            const zGroup = new THREE.Group();

            let color = 0x2e422c; // Default Green
            if (isBoss) {
                if (isExplosiveBoss) color = 0xff0000; // Red (Now Explosive!)
                else if (isPinkBoss) color = 0xff1493; // Deep Pink
            }
            if (isRanged) color = 0xcccc00; // Yellow
            if (isCrawler) color = 0x00aaaa; // Teal
            if (isVolatile) color = 0xff6600; // Orange

            const mat = new THREE.MeshStandardMaterial({ color: color });

            // Legs
            const legGeo = new THREE.BoxGeometry(0.6, 1.5, 0.6);
            const lLeg = new THREE.Mesh(legGeo, mat);
            lLeg.position.set(-0.4, 0.75, 0);
            const rLeg = new THREE.Mesh(legGeo, mat);
            rLeg.position.set(0.4, 0.75, 0);

            // Body
            const body = new THREE.Mesh(new THREE.BoxGeometry(1.6, 2.0, 1), mat);
            body.position.y = 2.5;

            // Head
            const head = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 1.2), mat);
            head.position.y = 4.1;

            const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
            const eye1 = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.25, 0.1), eyeMat);
            eye1.position.set(-0.3, 4.2, 0.55);
            const eye2 = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.25, 0.1), eyeMat);
            eye2.position.set(0.3, 4.2, 0.55);

            // Arms
            const armMat = new THREE.MeshStandardMaterial({ color: mat.color });
            const armGeo = new THREE.BoxGeometry(0.4, 0.4, 1.8);
            const lArm = new THREE.Mesh(armGeo, armMat);
            lArm.position.set(-1.0, 3.2, 0.6);
            const rArm = new THREE.Mesh(armGeo, armMat);
            rArm.position.set(1.0, 3.2, 0.6);

            const pingGeo = new THREE.OctahedronGeometry(0.8, 0);
            const pingMat = new THREE.MeshBasicMaterial({
                color: 0xff0000,
                depthTest: false, // X-Ray through walls
                depthWrite: false
            });
            const pingMarker = new THREE.Mesh(pingGeo, pingMat);
            pingMarker.position.y = 6.5;
            pingMarker.renderOrder = 999; // Ensure it renders on top
            pingMarker.visible = false;

            zGroup.add(lLeg, rLeg, body, head, eye1, eye2, lArm, rArm, pingMarker);

            if (isCrawler) {
                body.rotation.x = Math.PI / 2;
                body.position.set(0, 1.5, 0);
                head.position.set(0, 1.5, 1.4);
                eye1.position.set(-0.3, 1.6, 2.0);
                eye2.position.set(0.3, 1.6, 2.0);

                lLeg.position.set(-0.6, 0.75, -0.6);
                rLeg.position.set(0.6, 0.75, -0.6);

                // Repurpose arms as front legs
                lArm.geometry = legGeo;
                rArm.geometry = legGeo;
                lArm.position.set(-0.6, 0.75, 0.6);
                rArm.position.set(0.6, 0.75, 0.6);
            }

            if (isBoss) {
                const scale = isExplosiveBoss ? 3.5 : 2.5;
                zGroup.scale.set(scale, scale, scale); // Origin is now at bottom of feet
            }
            if (isCrawler) zGroup.scale.set(0.8, 0.8, 0.8);

            let pos = new THREE.Vector3();
            let safe = false;
            let tempBox = new THREE.Box3();

            while (!safe) {
                // Zombies can spawn right up against the walls now
                pos.set((Math.random() - 0.5) * (mapSize - 10), 0.1, (Math.random() - 0.5) * (mapSize - 10));
                if (pos.distanceTo(camera.position) < 80) continue;

                zGroup.position.copy(pos);
                tempBox.setFromObject(zGroup).expandByScalar(0.6);
                safe = true;
                for (let o of obstacles) {
                    if (tempBox.intersectsBox(o.box)) { safe = false; break; }
                }
            }

            scene.add(zGroup);

            let hpVal = 100; // Flat health for regular zombies, no more bullet sponges!
            if (isBoss) {
                if (isExplosiveBoss) hpVal = 6000 + currentWave * 1000; // Massive health pool
                else if (isPinkBoss) hpVal = 2500 + currentWave * 600;
            }

            let spd = 7 + currentWave * 0.5 + Math.random() * 3;
            if (isBoss) {
                if (isExplosiveBoss) spd = 14.0; // Slower, lumbering behemoth
                else if (isPinkBoss) spd = 22.0;
            }
            if (isCrawler) spd *= 2.2; // Crawlers run very fast!

            const zombieObj = {
                mesh: zGroup,
                box: new THREE.Box3(),
                hp: hpVal,
                maxHp: hpVal,
                speed: spd,
                velocity: new THREE.Vector3(0, 0, 0),
                isClimbing: false,
                isBoss: isBoss,
                isPinkBoss: isPinkBoss,
                isExplosiveBoss: isExplosiveBoss,
                combatMode: 'ranged', // Used for pink boss dynamic AI
                lastModeSwitch: 0,
                isRanged: isRanged,
                isCrawler: isCrawler,
                isVolatile: isVolatile,
                burnTimer: 0,
                lastFired: 0,
                lLeg: lLeg,
                rLeg: rLeg,
                lArm: lArm,
                rArm: rArm,
                pingMarker: pingMarker,
                walkCycle: Math.random() * Math.PI * 2
            };

            zombies.push(zombieObj);

            if (isBoss) {
                activeBoss = zombieObj;
                document.getElementById('boss-health-container').style.display = 'block';
                updateBossHealth();
            }
        }

        function showHitmarker(isKill) {
            const hm = document.getElementById('hitmarker');
            const lines = document.querySelectorAll('.hm-line');
            lines.forEach(l => l.style.background = isKill ? '#ff0000' : '#ffffff');
            hm.style.display = 'block';
            hm.style.opacity = '1';

            // Clear existing timeout
            if (hm.timeoutId) clearTimeout(hm.timeoutId);
            hm.timeoutId = setTimeout(() => { hm.style.opacity = '0'; }, 100);
        }

        function updateUI() {
            document.getElementById('health-display').innerText = `HP: ${hp}`;
            document.getElementById('low-health-overlay').style.opacity = hp < 25 ? '1' : '0';

            const w = WEAPONS[currentWeaponIdx];
            document.getElementById('ammo-display').innerText = `${w.ammo} / ${w.maxAmmo}`;
            document.getElementById('weapon-display').innerText = `${w.name} | G: ${grenadeCount}`;
            document.getElementById('wave-display').innerText = `Wave ${currentWave}`;

            if (waveActive) {
                document.getElementById('status-display').innerText = `Zombies Remaining: ${zombiesToSpawn - zombiesKilledThisWave}`;
            } else {
                const rem = Math.ceil(4 - waveTimer);
                document.getElementById('status-display').innerText = `Next wave in ${rem}...`;
            }

            const comboDisplay = document.getElementById('combo-display');
            if (killStreak > 1) {
                comboDisplay.style.display = 'block';
                comboDisplay.innerText = `STREAK: ${comboMultiplier.toFixed(1)}x`;
                if (comboMultiplier >= 3.0) comboDisplay.style.color = '#ff0000'; // Max streak red
                else if (comboMultiplier >= 2.0) comboDisplay.style.color = '#ffaa00'; // High streak orange
                else comboDisplay.style.color = '#ffff00'; // Low streak yellow
            } else {
                comboDisplay.style.display = 'none';
            }
        }

        function updateBossHealth() {
            if (activeBoss) {
                const pct = Math.max(0, (activeBoss.hp / activeBoss.maxHp) * 100);
                document.getElementById('boss-health-bar').style.width = pct + '%';
            }
        }

        function reload() {
            const w = WEAPONS[currentWeaponIdx];
            if (isReloading || w.ammo === w.maxAmmo) return;
            isReloading = true;
            document.getElementById('ammo-display').innerText = `Reloading...`;
            setTimeout(() => {
                w.ammo = w.maxAmmo;
                isReloading = false;
                updateUI();
            }, 1500);
        }

        function shoot() {
            const w = WEAPONS[currentWeaponIdx];
            const now = performance.now();
            if (now - w.lastFired < w.fireRate || w.ammo <= 0 || isReloading) {
                if (w.ammo <= 0 && !isReloading) reload();
                return;
            }

            w.lastFired = now;
            w.ammo--;
            updateUI();
            playSound(currentWeaponIdx === 1 ? 'shotgun' : 'shoot');

            // Visual Muzzle Flash
            w.flash.intensity = 2.0;
            w.flashMesh.material.opacity = 0.9;
            w.flashMesh.scale.setScalar(1 + Math.random() * 0.5);
            w.flashMesh.rotation.z = Math.random() * Math.PI;

            // Recoil applied via Pitch (Rotation X) safely
            camera.rotation.x += (Math.random() * 0.02) + 0.01;

            for (let p = 0; p < w.pellets; p++) {
                let geo, mat, mesh, velMult, lifeTime;

                if (w.isFlame) {
                    geo = new THREE.SphereGeometry(0.4, 8, 8);
                    mat = new THREE.MeshBasicMaterial({ color: 0xff5500, transparent: true, opacity: 0.8 });
                    mesh = new THREE.Mesh(geo, mat);
                    velMult = 60; // Slower moving fire
                    lifeTime = 0.8; // Short range
                } else {
                    geo = new THREE.BoxGeometry(0.1, 0.1, 4.0);
                    mat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
                    mesh = new THREE.Mesh(geo, mat);
                    velMult = 400; // Fast bullets
                    lifeTime = 2.0;
                }

                // Position bullet slightly in front of camera
                mesh.position.copy(camera.position);
                const dir = new THREE.Vector3();
                camera.getWorldDirection(dir);
                mesh.position.add(dir.multiplyScalar(2.0));

                // Spread
                dir.x += (Math.random() - 0.5) * w.spread;
                dir.y += (Math.random() - 0.5) * w.spread;
                dir.z += (Math.random() - 0.5) * w.spread;
                dir.normalize();

                if (!w.isFlame) mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,-1), dir);

                scene.add(mesh);
                bullets.push({
                    mesh: mesh,
                    velocity: dir.multiplyScalar(velMult),
                    life: lifeTime,
                    damage: w.damage * comboMultiplier, // Apply active combo multiplier
                    lastPos: mesh.position.clone(),
                    isFlame: w.isFlame
                });
            }
        }

        function melee() {
            const now = performance.now();
            if (now - lastMeleeTime < 800) return;
            lastMeleeTime = now;

            const wMesh = WEAPONS[currentWeaponIdx].mesh;
            const origZ = wMesh.position.z;
            wMesh.position.z -= 0.8;
            setTimeout(() => { wMesh.position.z = origZ; }, 150);

            playSound('shotgun'); // Punchy sound

            for (let j = zombies.length - 1; j >= 0; j--) {
                const z = zombies[j];
                const dist = camera.position.distanceTo(z.mesh.position);
                if (dist < 8.0) {
                    const dirToZombie = new THREE.Vector3().subVectors(z.mesh.position, camera.position).normalize();
                    const camDir = new THREE.Vector3();
                    camera.getWorldDirection(camDir);

                    if (camDir.dot(dirToZombie) > 0.4) {
                        registerHit();
                        z.hp -= 150 * comboMultiplier;
                        if (z.isBoss) updateBossHealth();

                        if (z.hp <= 0) {
                            processZombieDeath(z, j);
                        } else {
                            z.mesh.position.add(camDir.multiplyScalar(3.0)); // Knockback
                            showHitmarker(false);
                        }
                    }
                }
            }
        }

        function triggerDamage(amt) {
            if (invulnTimer > 0) return;
            hp -= amt;
            invulnTimer = 1.5;
            updateUI();
            playSound('damage');

            const flash = document.getElementById('damage-flash');
            flash.style.opacity = 0.6;
            setTimeout(() => flash.style.opacity = 0, 150);

            if (hp <= 0) gameOver();
        }

        function processZombieDeath(z, index) {
            scene.remove(z.mesh);
            zombies.splice(index, 1);
            zombiesKilledThisWave++;
            registerKill(); // Trigger combo boost
            updateUI();
            playSound('zombieDeath');
            showHitmarker(true);

            if (z.isBoss) {
                activeBoss = null;
                document.getElementById('boss-health-container').style.display = 'none';
            }

            if (z.isVolatile) {
                playExplosionSound();
                const exGeo = new THREE.SphereGeometry(15, 16, 16);
                const exMat = new THREE.MeshBasicMaterial({ color: 0xff3300, transparent: true, opacity: 0.8 });
                const exMesh = new THREE.Mesh(exGeo, exMat);
                exMesh.position.copy(z.mesh.position);
                scene.add(exMesh);
                explosions.push({ mesh: exMesh, life: 0.5 });

                if (camera.position.distanceTo(z.mesh.position) < 15) {
                    triggerDamage(40);
                }
            }
        }

        function throwGrenade() {
            if (grenadeCount <= 0) return;
            grenadeCount--;
            updateUI();

            const geo = new THREE.SphereGeometry(0.3, 8, 8);
            const mat = new THREE.MeshStandardMaterial({ color: 0x4a5d23 }); // Olive green
            const mesh = new THREE.Mesh(geo, mat);

            mesh.position.copy(camera.position);
            const dir = new THREE.Vector3();
            camera.getWorldDirection(dir);
            mesh.position.add(dir.multiplyScalar(1.5));

            scene.add(mesh);

            grenades.push({
                mesh: mesh,
                velocity: dir.multiplyScalar(25).add(new THREE.Vector3(0, 5, 0)), // Toss forward and up
                life: 2.5, // 2.5 second fuse
                box: new THREE.Box3(),
                combo: comboMultiplier // Snapshot your combo multiplier for the explosion
            });
        }

        // --- Main Loop ---
        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now();
            const delta = Math.min((time - lastTime) / 1000, 0.1); // Cap delta to prevent huge jumps
            lastTime = time;

            if (isGameActive) {
                // Weapon Kill Streak Timeout (5 Seconds)
                if (killStreak > 0 && time - lastHitTime > 5000) {
                    killStreak = 0;
                    comboMultiplier = 1.0;
                    updateUI();
                }

                // FOV Lerp for Sniper Zoom
                targetFov = isZooming ? 20 : 75;
                if (Math.abs(camera.fov - targetFov) > 1) {
                    camera.fov += (targetFov - camera.fov) * 15 * delta;
                    camera.updateProjectionMatrix();
                }

                // Wave Logic
                if (waveActive) {
                    if (zombies.length < Math.min(MAX_ZOMBIES, zombiesToSpawn - zombiesKilledThisWave) && Math.random() < 0.02) {
                        // Check if it's time to spawn a boss (Every 5th wave, first zombie)
                        let isBoss = false;
                        let isPinkBoss = false;
                        let isExplosiveBoss = false;
                        if (currentWave % 5 === 0 && zombiesKilledThisWave === 0 && !activeBoss) {
                            isBoss = true;
                            if (currentWave % 10 === 5) isPinkBoss = true; // Wave 5, 15, 25...
                            else isExplosiveBoss = true; // Wave 10, 20, 30...
                        }
                        spawnZombie(isBoss, isPinkBoss, isExplosiveBoss);
                    }
                    if (zombiesKilledThisWave >= zombiesToSpawn) {
                        waveActive = false;
                        waveTimer = 0;
                        updateUI();
                    }
                } else {
                    waveTimer += delta;
                    updateUI();
                    if (waveTimer > 4) {
                        currentWave++;
                        if (currentWave > highscore) {
                            highscore = currentWave;
                            localStorage.setItem('zombieCityHighscore', highscore);
                            document.getElementById('highscore-display').innerText = highscore;
                        }
                        zombiesToSpawn = 10 + currentWave * 3;
                        zombiesKilledThisWave = 0;
                        waveActive = true;
                        updateUI();
                        // Spawn 1 or 2 health packs guaranteed between waves
                        spawnHealthPack();
                        if (Math.random() > 0.3) spawnHealthPack();
                        // Spawn grenade supplies
                        spawnGrenadePickup();
                        if (Math.random() > 0.5) spawnGrenadePickup();
                    }
                }

                if (invulnTimer > 0) invulnTimer -= delta;

                // Player Movement Setup
                const dir = new THREE.Vector3();
                camera.getWorldDirection(dir);
                dir.y = 0; dir.normalize();

                const sideDir = new THREE.Vector3();
                sideDir.crossVectors(camera.up, dir).normalize();

                const targetVel = new THREE.Vector3();
                if (moveForward) targetVel.add(dir);
                if (moveBackward) targetVel.sub(dir);
                if (moveLeft) targetVel.add(sideDir);
                if (moveRight) targetVel.sub(sideDir);

                if (targetVel.length() > 0) targetVel.normalize().multiplyScalar(speed);

                // Apply horizontal friction/accel
                playerVelocity.x += (targetVel.x - playerVelocity.x) * 10 * delta;
                playerVelocity.z += (targetVel.z - playerVelocity.z) * 10 * delta;

                // Gravity
                playerVelocity.y -= gravity * delta;

                // Move X
                camera.position.x += playerVelocity.x * delta;
                // Full height collision to prevent legs clipping into roofs!
                playerBox.setFromCenterAndSize(
                    new THREE.Vector3(camera.position.x, camera.position.y - 2, camera.position.z),
                    new THREE.Vector3(0.6, 4, 0.6)
                );
                for (let o of obstacles) {
                    if (playerBox.intersectsBox(o.box)) {
                        camera.position.x -= playerVelocity.x * delta;
                        playerVelocity.x = 0;
                        break;
                    }
                }

                // Move Z
                camera.position.z += playerVelocity.z * delta;
                playerBox.setFromCenterAndSize(
                    new THREE.Vector3(camera.position.x, camera.position.y - 2, camera.position.z),
                    new THREE.Vector3(0.6, 4, 0.6)
                );
                for (let o of obstacles) {
                    if (playerBox.intersectsBox(o.box)) {
                        camera.position.z -= playerVelocity.z * delta;
                        playerVelocity.z = 0;
                        break;
                    }
                }

                // Ladder Climbing Logic
                playerBox.setFromCenterAndSize(
                    new THREE.Vector3(camera.position.x, camera.position.y - 2, camera.position.z),
                    new THREE.Vector3(1.0, 4, 1.0)
                );
                for (let l of ladders) {
                    if (playerBox.intersectsBox(l.box)) {
                        if (moveForward) {
                            playerVelocity.y = 12.0; // Climb up smoothly!
                        } else if (moveBackward) {
                            playerVelocity.y = -12.0; // Climb down
                        } else if (playerVelocity.y < 0) {
                            playerVelocity.y = -2.0; // Slide down slowly
                        }
                        break;
                    }
                }

                // Move Y
                camera.position.y += playerVelocity.y * delta;
                playerOnGround = false;

                // Math fix for landing perfectly on roofs
                playerBox.setFromCenterAndSize(
                    new THREE.Vector3(camera.position.x, camera.position.y - 2, camera.position.z),
                    new THREE.Vector3(0.6, 4, 0.6) // Thinner here too
                );

                for (let o of obstacles) {
                    if (playerBox.intersectsBox(o.box)) {
                        if (playerVelocity.y < 0) {
                            // Falling onto something
                            camera.position.y = o.box.max.y + 4.01; // Added 0.01 micro-margin so floor doesn't snag next frame!
                            playerVelocity.y = 0;
                            playerOnGround = true;
                        } else if (playerVelocity.y > 0) {
                            // Hitting head
                            camera.position.y = o.box.min.y - 0.1;
                            playerVelocity.y = 0;
                        }
                        break;
                    }
                }

                // Floor fallback
                if (camera.position.y < 4) {
                    camera.position.y = 4;
                    playerVelocity.y = 0;
                    playerOnGround = true;
                }

                // Health Packs
                for (let i = healthPacks.length - 1; i >= 0; i--) {
                    const hpck = healthPacks[i];
                    hpck.mesh.rotation.y += delta;

                    if (hp < maxHp && playerBox.intersectsBox(hpck.box)) {
                        hp = Math.min(maxHp, hp + 50);
                        updateUI();
                        playSound('heal');
                        const flash = document.getElementById('heal-flash');
                        flash.style.opacity = 0.6;
                        setTimeout(() => flash.style.opacity = 0, 150);

                        scene.remove(hpck.mesh);
                        healthPacks.splice(i, 1);
                    }
                }

                // Grenade Pickups
                for (let i = grenadePickups.length - 1; i >= 0; i--) {
                    const gp = grenadePickups[i];
                    gp.mesh.rotation.y += delta;

                    if (playerBox.intersectsBox(gp.box)) {
                        grenadeCount += 2; // +2 Grenades per box!
                        updateUI();
                        playSound('heal');

                        scene.remove(gp.mesh);
                        grenadePickups.splice(i, 1);
                    }
                }

                if (isShooting) shoot();

                // Flash Decay
                for (let wKey in WEAPONS) {
                    const w = WEAPONS[wKey];
                    if (w.flash && w.flash.intensity > 0) w.flash.intensity -= 300 * delta;
                    if (w.flashMesh && w.flashMesh.material.opacity > 0) w.flashMesh.material.opacity -= 15 * delta;
                }

                // Handle Bullets & Hit Detection (Raycasting to prevent tunneling)
                for (let i = bullets.length - 1; i >= 0; i--) {
                    const b = bullets[i];
                    b.lastPos.copy(b.mesh.position);

                    b.mesh.position.addScaledVector(b.velocity, delta);
                    b.life -= delta;

                    if (b.isFlame) {
                        b.mesh.scale.addScalar(8 * delta); // Flames expand
                        b.mesh.material.opacity -= 1.0 * delta; // Flames fade out
                    }

                    // Raycast check between last frame and this frame
                    const path = new THREE.Vector3().subVectors(b.mesh.position, b.lastPos);
                    const dist = path.length();
                    const ray = new THREE.Ray(b.lastPos, path.clone().normalize());

                    let hit = false;
                    let closestDist = dist + 1;
                    let hitZombie = null;
                    let hitPt = new THREE.Vector3();

                    // Check walls first, find distance
                    for (let o of obstacles) {
                        if (ray.intersectBox(o.box, hitPt)) {
                            let d = b.lastPos.distanceTo(hitPt);
                            if (d <= dist && d < closestDist) {
                                closestDist = d;
                                hit = true;
                                hitZombie = null; // Wall blocked the shot
                            }
                        }
                    }

                    // Check zombies and see if they are closer than the wall
                    for (let j = zombies.length - 1; j >= 0; j--) {
                        const z = zombies[j];
                        // Expand the box slightly to make hitting much more generous
                        const targetBox = z.box.clone().expandByScalar(0.7);

                        // Check if bullet spawned inside zombie (point blank headshots)
                        if (targetBox.containsPoint(b.lastPos)) {
                            closestDist = 0;
                            hit = true;
                            hitZombie = { z: z, idx: j };
                        } else if (ray.intersectBox(targetBox, hitPt)) {
                            let d = b.lastPos.distanceTo(hitPt);
                            if (d <= dist && d < closestDist) {
                                closestDist = d;
                                hit = true;
                                hitZombie = { z: z, idx: j };
                            }
                        }
                    }

                    if (hit) {
                        if (hitZombie) {
                            registerHit();
                            const z = hitZombie.z;
                            z.hp -= b.damage;

                            if (b.isFlame) z.burnTimer = 3.0; // Apply 3 seconds of Burning!

                            if (z.isBoss) updateBossHealth();

                            if (z.hp <= 0) {
                                processZombieDeath(z, hitZombie.idx);
                            } else {
                                showHitmarker(false);
                            }
                        } else {
                            showHitmarker(false);
                        }
                        scene.remove(b.mesh);
                        bullets.splice(i, 1);
                    } else if (b.life <= 0) {
                        scene.remove(b.mesh);
                        bullets.splice(i, 1);
                    }
                }

                // Handle Zombies
                for (let zi = zombies.length - 1; zi >= 0; zi--) {
                    let z = zombies[zi];

                    if (z.burnTimer > 0) {
                        z.burnTimer -= delta;
                        z.hp -= 25 * delta; // 25 Damage over time per second

                        // Visual fire effect
                        z.mesh.children.forEach(c => {
                            if (c.material && c.material.emissive !== undefined) {
                                c.material.emissive = new THREE.Color(0xff5500);
                                c.material.emissiveIntensity = 0.6;
                            }
                        });

                        if (z.isBoss) updateBossHealth();

                        if (z.hp <= 0) {
                            processZombieDeath(z, zi);
                            continue; // Zombie died to fire, skip the rest of its movement!
                        }
                    } else {
                        z.mesh.children.forEach(c => {
                            if (c.material && c.material.emissive !== undefined) {
                                c.material.emissiveIntensity = 0;
                            }
                        });
                    }

                    z.mesh.lookAt(camera.position.x, z.mesh.position.y, camera.position.z);

                    const pDir = new THREE.Vector3().subVectors(camera.position, z.mesh.position);
                    pDir.y = 0; pDir.normalize();

                    const scale = z.isExplosiveBoss ? 3.5 : (z.isBoss ? 2.5 : 1.0);
                    const distToPlayer = z.mesh.position.distanceTo(camera.position);

                    // Catch-up mechanic: If a zombie gets stuck far away, drop them closer!
                    if (distToPlayer > 150 && !z.isBoss) {
                        let angle = Math.random() * Math.PI * 2;
                        let nx = camera.position.x + Math.cos(angle) * 70;
                        let nz = camera.position.z + Math.sin(angle) * 70;
                        nx = Math.max(-mapSize/2 + 10, Math.min(mapSize/2 - 10, nx));
                        nz = Math.max(-mapSize/2 + 10, Math.min(mapSize/2 - 10, nz));
                        z.mesh.position.set(nx, 60, nz); // Drop from the sky
                        z.velocity.y = 0;
                    }

                    // Ping the last 5 zombies
                    let isLastFew = (zombiesToSpawn - zombiesKilledThisWave <= 5 && zombies.length <= 5);
                    if (isLastFew) {
                        z.pingMarker.visible = true;
                        z.pingMarker.rotation.y += 3 * delta;
                        z.pingMarker.position.y = 6.5 + Math.sin(time * 0.005) * 0.5; // Bobbing effect
                    } else {
                        z.pingMarker.visible = false;
                    }

                    // Speed Boost for final zombies in wave
                    let activeSpeed = z.speed;
                    if (zombiesToSpawn - zombiesKilledThisWave <= 3 && zombies.length <= 3) {
                        activeSpeed *= 1.5;
                    }

                    // Helper to mathematically size the zombie box covering whole body/head
                    const updateZBox = () => {
                        if (z.isCrawler) {
                            z.box.setFromCenterAndSize(
                                new THREE.Vector3(z.mesh.position.x, z.mesh.position.y + 1.0, z.mesh.position.z),
                                new THREE.Vector3(1.8, 2.0, 1.8)
                            );
                        } else {
                            z.box.setFromCenterAndSize(
                                new THREE.Vector3(z.mesh.position.x, z.mesh.position.y + (3.2 * scale), z.mesh.position.z),
                                new THREE.Vector3(2.0 * scale, 6.4 * scale, 2.0 * scale)
                            );
                        }
                    };

                    // Movement & Climbing
                    let moveDir = pDir.clone();

                    // Ranged zombies try to stay back
                    if (z.isRanged) {
                        if (distToPlayer < 40) {
                            moveDir.multiplyScalar(-1); // Back away if too close
                        } else if (distToPlayer < 60) {
                            moveDir.set(0,0,0); // Hold position
                        }
                    }

                    // Pink Boss dynamic combat behavior
                    if (z.isPinkBoss) {
                        if (time - z.lastModeSwitch > 6000) {
                            z.combatMode = z.combatMode === 'ranged' ? 'melee' : 'ranged';
                            z.lastModeSwitch = time;
                        }

                        if (z.combatMode === 'ranged') {
                            if (distToPlayer < 50) {
                                moveDir.multiplyScalar(-1);
                            } else if (distToPlayer < 70) {
                                moveDir.set(0,0,0);
                            }
                        }
                    }

                    z.mesh.position.x += moveDir.x * activeSpeed * delta;
                    updateZBox();

                    // Lift collision check off the ground slightly so they don't snag on roofs
                    let checkBox = z.box.clone();
                    checkBox.min.y += 0.5;

                    let hitWall = false;
                    for (let o of obstacles) {
                        if (checkBox.intersectsBox(o.box)) {
                            z.mesh.position.x -= moveDir.x * activeSpeed * delta;
                            hitWall = true;
                            break;
                        }
                    }

                    z.mesh.position.z += moveDir.z * activeSpeed * delta;
                    updateZBox();
                    checkBox = z.box.clone();
                    checkBox.min.y += 0.5;

                    for (let o of obstacles) {
                        if (checkBox.intersectsBox(o.box)) {
                            z.mesh.position.z -= moveDir.z * activeSpeed * delta;
                            hitWall = true;
                            break;
                        }
                    }

                    // Zombie Walk Animation
                    if (moveDir.lengthSq() > 0.01 || z.isClimbing) {
                        z.walkCycle += (z.isClimbing ? 15 : activeSpeed) * delta * 0.8;
                        if (z.isCrawler) {
                            z.lLeg.rotation.x = Math.sin(z.walkCycle) * 0.8;
                            z.rLeg.rotation.x = Math.sin(z.walkCycle + Math.PI) * 0.8;
                            z.lArm.rotation.x = Math.sin(z.walkCycle + Math.PI) * 0.8; // Front Left
                            z.rArm.rotation.x = Math.sin(z.walkCycle) * 0.8; // Front Right
                        } else {
                            z.lLeg.rotation.x = Math.sin(z.walkCycle) * 0.7;
                            z.rLeg.rotation.x = Math.sin(z.walkCycle + Math.PI) * 0.7;
                            z.lArm.rotation.x = Math.sin(z.walkCycle + Math.PI) * 0.4;
                            z.rArm.rotation.x = Math.sin(z.walkCycle) * 0.4;
                        }
                    } else {
                        z.lLeg.rotation.x = 0;
                        z.rLeg.rotation.x = 0;
                        z.lArm.rotation.x = 0;
                        z.rArm.rotation.x = 0;
                    }

                    // Climbing Logic
                    if (hitWall && z.mesh.position.y < camera.position.y + 2) {
                        z.isClimbing = true;
                        z.velocity.y = 15.0; // Scramble up
                    }

                    if (!z.isClimbing) {
                        z.velocity.y -= gravity * delta;
                    }

                    z.mesh.position.y += z.velocity.y * delta;
                    updateZBox();

                    let touchingObstacle = false;
                    for (let o of obstacles) {
                        if (z.box.intersectsBox(o.box)) {
                            touchingObstacle = true;
                            if (z.velocity.y < 0) { // Landing
                                z.mesh.position.y = o.box.max.y;
                                z.velocity.y = 0;
                            }
                        }
                    }

                    // If climbing and cleared the wall, stop climbing
                    if (z.isClimbing && !touchingObstacle) {
                        z.isClimbing = false;
                        z.velocity.y = 0;
                        z.mesh.position.x += pDir.x * 2; // Step forward onto roof
                        z.mesh.position.z += pDir.z * 2;
                    }

                    // Floor
                    if (z.mesh.position.y < 0.1) {
                        z.mesh.position.y = 0.1;
                        z.velocity.y = 0;
                        z.isClimbing = false;
                    }

                    updateZBox(); // Final hitbox update for bullets/player collision

                    // Player Damage
                    if (invulnTimer <= 0 && playerBox.intersectsBox(z.box)) {
                        triggerDamage(z.isBoss ? (z.isExplosiveBoss ? 40 : 25) : 10);
                    }

                    // Boss Fireball Attack
                    if (z.isBoss) {
                        let fireRate = z.isExplosiveBoss ? 2000 : (z.isPinkBoss ? 1200 : 2500);
                        if (time - z.lastFired > fireRate) {
                            z.lastFired = time;

                            let pColor = z.isExplosiveBoss ? 0xff3300 : 0xff1493; // Orange-red for the massive explosive boss

                            const pGeo = new THREE.SphereGeometry(z.isExplosiveBoss ? 1.8 : 1.2, 8, 8);
                            const pMat = new THREE.MeshBasicMaterial({ color: pColor });
                            const pMesh = new THREE.Mesh(pGeo, pMat);
                            pMesh.position.copy(z.mesh.position);
                            pMesh.position.y += z.isExplosiveBoss ? 12.0 : 9.0; // Fire from boss head height

                            const dir = new THREE.Vector3().subVectors(camera.position, pMesh.position).normalize();
                            scene.add(pMesh);
                            bossProjectiles.push({
                                mesh: pMesh,
                                box: new THREE.Box3(),
                                velocity: dir.multiplyScalar(z.isExplosiveBoss ? 65 : 45),
                                life: 4.0,
                                damage: z.isExplosiveBoss ? 40 : 35,
                                isExplosive: z.isExplosiveBoss
                            });
                        }
                    }

                    // Ranged Zombie Spit Attack
                    if (z.isRanged && time - z.lastFired > 3000) {
                        // Only shoot if roughly in line of sight (not climbing and distance < 70)
                        if (!z.isClimbing && distToPlayer < 70) {
                            z.lastFired = time;
                            const pGeo = new THREE.SphereGeometry(0.5, 8, 8);
                            const pMat = new THREE.MeshBasicMaterial({ color: 0xcccc00 });
                            const pMesh = new THREE.Mesh(pGeo, pMat);
                            pMesh.position.copy(z.mesh.position);
                            pMesh.position.y += 4.0; // Fire from mouth height

                            const dir = new THREE.Vector3().subVectors(camera.position, pMesh.position).normalize();
                            scene.add(pMesh);
                            bossProjectiles.push({
                                mesh: pMesh,
                                box: new THREE.Box3(),
                                velocity: dir.multiplyScalar(20), // Slow projectile
                                life: 6.0,
                                damage: 15
                            });
                        }
                    }
                }

                // Handle Boss Projectiles (and Ranged Zombie spits)
                for (let i = bossProjectiles.length - 1; i >= 0; i--) {
                    const p = bossProjectiles[i];
                    p.mesh.position.addScaledVector(p.velocity, delta);
                    p.box.setFromObject(p.mesh);
                    p.life -= delta;

                    let hitWall = false;
                    for (let o of obstacles) {
                        if (p.box.intersectsBox(o.box)) { hitWall = true; break; }
                    }

                    if (p.mesh.position.y < 0) hitWall = true;

                    if (invulnTimer <= 0 && p.box.intersectsBox(playerBox)) {
                        triggerDamage(p.damage || 20); // Dynamic damage based on projectile
                        hitWall = true;
                    }

                    if (hitWall || p.life <= 0) {
                        if (p.isExplosive) {
                            playExplosionSound();
                            const exGeo = new THREE.SphereGeometry(15, 16, 16);
                            const exMat = new THREE.MeshBasicMaterial({ color: 0xff3300, transparent: true, opacity: 0.8 }); // Red explosion
                            const exMesh = new THREE.Mesh(exGeo, exMat);
                            exMesh.position.copy(p.mesh.position);
                            scene.add(exMesh);
                            explosions.push({ mesh: exMesh, life: 0.5 });

                            const px = camera.position.x - p.mesh.position.x;
                            const pz = camera.position.z - p.mesh.position.z;
                            if (Math.sqrt(px*px + pz*pz) < 15) {
                                triggerDamage(40); // Explosive splash damage
                            }
                        }
                        scene.remove(p.mesh);
                        bossProjectiles.splice(i, 1);
                    }
                }

                // Handle Grenades
                for (let i = grenades.length - 1; i >= 0; i--) {
                    const g = grenades[i];
                    g.velocity.y -= gravity * 0.5 * delta; // Less gravity for bouncing

                    g.mesh.position.x += g.velocity.x * delta;
                    g.box.setFromObject(g.mesh);
                    for (let o of obstacles) {
                        if (g.box.intersectsBox(o.box)) {
                            g.mesh.position.x -= g.velocity.x * delta;
                            g.velocity.x *= -0.5; // Bounce and dampen
                            break;
                        }
                    }

                    g.mesh.position.z += g.velocity.z * delta;
                    g.box.setFromObject(g.mesh);
                    for (let o of obstacles) {
                        if (g.box.intersectsBox(o.box)) {
                            g.mesh.position.z -= g.velocity.z * delta;
                            g.velocity.z *= -0.5;
                            break;
                        }
                    }

                    g.mesh.position.y += g.velocity.y * delta;
                    g.box.setFromObject(g.mesh);
                    for (let o of obstacles) {
                        if (g.box.intersectsBox(o.box)) {
                            if (g.velocity.y < 0) { // Hit floor
                                g.mesh.position.y = o.box.max.y + 0.3;
                                g.velocity.y *= -0.5;
                                g.velocity.x *= 0.8; // Friction
                                g.velocity.z *= 0.8;
                            } else {
                                g.velocity.y *= -0.5;
                            }
                            break;
                        }
                    }

                    if (g.mesh.position.y < 0.3) {
                        g.mesh.position.y = 0.3;
                        g.velocity.y *= -0.5;
                        g.velocity.x *= 0.8;
                        g.velocity.z *= 0.8;
                    }

                    g.life -= delta;
                    if (g.life <= 0) {
                        // Detonate!
                        playExplosionSound();

                        // Visual explosion sphere
                        const exGeo = new THREE.SphereGeometry(25, 16, 16);
                        const exMat = new THREE.MeshBasicMaterial({ color: 0xff5500, transparent: true, opacity: 0.8 });
                        const exMesh = new THREE.Mesh(exGeo, exMat);
                        exMesh.position.copy(g.mesh.position);
                        scene.add(exMesh);
                        explosions.push({ mesh: exMesh, life: 0.5 }); // Fade out over 0.5s

                        // Damage Zombies in radius
                        for (let j = zombies.length - 1; j >= 0; j--) {
                            const z = zombies[j];
                            // 2D Distance check ensures grenades hit tall bosses reliably!
                            const dx = z.mesh.position.x - g.mesh.position.x;
                            const dz = z.mesh.position.z - g.mesh.position.z;
                            if (Math.sqrt(dx*dx + dz*dz) < 25) {
                                registerHit();
                                if (z.isBoss) {
                                    z.hp -= 1500 * g.combo; // Apply snapshot combo
                                } else {
                                    z.hp = 0; // Instakill standard
                                }

                                if (z.isBoss) updateBossHealth();

                                if (z.hp <= 0) {
                                    processZombieDeath(z, j);
                                }
                            }
                        }

                        // Player damage if caught in blast
                        const px = camera.position.x - g.mesh.position.x;
                        const pz = camera.position.z - g.mesh.position.z;
                        if (Math.sqrt(px*px + pz*pz) < 25) {
                            triggerDamage(75); // Massive self-damage for standing too close!
                        }

                        scene.remove(g.mesh);
                        grenades.splice(i, 1);
                    }
                }

                // Handle Explosions fading
                for (let i = explosions.length - 1; i >= 0; i--) {
                    const ex = explosions[i];
                    ex.life -= delta;
                    ex.mesh.scale.addScalar(15 * delta); // Expand rapidly
                    ex.mesh.material.opacity = (ex.life / 0.5) * 0.8;
                    if (ex.life <= 0) {
                        scene.remove(ex.mesh);
                        explosions.splice(i, 1);
                    }
                }
            }
            renderer.render(scene, camera);
        }

        function startGame() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();

            try {
                const promise = document.body.requestPointerLock();
                if (promise && promise.catch) {
                    promise.catch(e => console.warn("Pointer lock cooldown active:", e));
                }
            } catch (err) {
                console.warn("Pointer lock cooldown active:", err);
            }

            if (hp <= 0) resetGame();
        }

        function resetGame() {
            hp = maxHp;
            grenadeCount = 2;
            currentWave = 1;
            zombiesToSpawn = 10;
            zombiesKilledThisWave = 0;
            waveActive = true;
            waveTimer = 0;
            invulnTimer = 0;

            killStreak = 0;
            comboMultiplier = 1.0;
            lastHitTime = 0;

            isShooting = false;
            isReloading = false;

            WEAPONS.forEach(w => {
                w.ammo = w.maxAmmo;
                w.flash.intensity = 0;
                if (w.flashMesh) w.flashMesh.material.opacity = 0;
            });
            switchWeapon(0);

            for (let z of zombies) scene.remove(z.mesh);
            zombies = [];

            for (let b of bullets) scene.remove(b.mesh);
            bullets = [];

            for (let hpck of healthPacks) scene.remove(hpck.mesh);
            healthPacks = [];

            for (let gp of grenadePickups) scene.remove(gp.mesh);
            grenadePickups = [];

            for (let p of bossProjectiles) scene.remove(p.mesh);
            bossProjectiles = [];

            for (let g of grenades) scene.remove(g.mesh);
            grenades = [];

            for (let ex of explosions) scene.remove(ex.mesh);
            explosions = [];

            activeBoss = null;
            document.getElementById('boss-health-container').style.display = 'none';

            camera.position.set(0, 4, 0);
            camera.rotation.set(0,0,0);
            playerVelocity.set(0,0,0);

            updateUI();
        }

        function gameOver() {
            isGameActive = false;

            if (currentWave > highscore) {
                highscore = currentWave;
                localStorage.setItem('zombieCityHighscore', highscore);
                document.getElementById('highscore-display').innerText = highscore;
            }

            document.exitPointerLock();
            document.getElementById('menu').style.display = 'flex';
            document.getElementById('menu-title').innerText = "YOU DIED";
            document.getElementById('restart-btn').style.display = 'none';
            document.getElementById('menu-buttons').style.display = 'flex';
            document.getElementById('resume-btn').style.display = 'none';
        }

        // Leave the game by pressing the kiosk's own "Back to Hub" button.
        // The first Esc is used by the browser to release the mouse; once the
        // mouse is free (menu showing), Esc returns to the kiosk hub.
        function exitToHub() {
            try {
                if (window.parent !== window) {
                    window.parent.document.getElementById('back').click();
                }
            } catch (error) { /* not running inside the kiosk: nothing to go back to */ }
        }
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Escape' && !isGameActive) exitToHub();
        });

        window.onload = init;
    </script>
</body>
</html>

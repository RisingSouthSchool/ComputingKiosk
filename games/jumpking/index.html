  boss_y = 0
 
  level5_text = ""
 
  win_flash = 0
 
  win_timer = 0
 
  mode = "title"
 
  level = 1
  level_timer = 0

  gameover = 0

  current_background = "background"
 
  bg_done = 0

  player_x = 0
  player_y = 30
  player_vy = jump_force * 0.5

  camY = 0
  score = 0

  platforms = []
  highest = -100

  for i = 0 to 12

    p = object
      x = random.nextInt(250) - 50
      y = -100 + i * 20
      category = 1
      dir = 1
      used = 0
    end

    platforms.push(p)

    if p.y > highest then highest = p.y end

  end

end



update = function()
 
  if win_flash > 0 then
    win_flash -= 1
 
  if win_flash == 0 then
    gameover = 2
  end
 
  return
  end

 
  if mode == "title" then
    updateTitlescreen()
   
  elsif mode == "play" then
    
  if boss_active == 1 then
    boss_y = camY + 80
    end
    
  // boss swords drop per 4 secounds
    if boss_active == 1 then
      sword_timer += 1
      if sword_timer >= sword_interval then
        sword_timer = 0
      s = object 
        x = boss_x
        y = boss_y - 10
        vy = -2
        end
        
        swords.push(s)
      end
    end
  
  
  for s in swords
    s.y += s.vy 
    end
  
  // swords dissapear after they fall out of screen
  for i = swords.length - 1 to 0
    s = swords[i]
    if s.y < camY - 160 then
      swords.splice(i, 1)
    end
  end
  
  //swords take one life without resseting char position.
  for i = swords.length - 1 to 0
    s = swords[i]
    if abs(player_x - s.x) < 20 and abs(player_y - s.y) < 20 then
      lives -= 1
      swords.splice(i, 1)
      
      if lives <= 0 then 
        gameover =1 
      end
    end
  end

 
  //background switch
 
  if score >= 2000 and bg_done == 0 then
    next_background = "background2"
    bg_transition = 200 // start above screen (the next background)
    bg_transitioning = 1
    bg_done = 1
    level = 2
    level_timer = level_duration
  end
 
  if score >= 5000 and bg_done == 1 then
    next_background = "background3"
    bg_transition = 200 // start above screen (the next background)
    bg_transitioning = 2
    bg_done = 2
    level = 3
    level_timer = level_duration
  end
 
  if score >= 10000 and bg_done == 2 then
    next_background = "background4"
    bg_transition = 200 // start above screen (the next background)
    bg_transitioning = 3
    bg_done = 3
    level = 4
    level_timer = level_duration
    boss_active = 1
    boss_x = 0
    boss_y = 85
  end

  if score >= 20000 and bg_done == 3 then
    next_background = "background5"
    bg_transition = 200 // start above screen (the next background)
    bg_transitioning = 4
    bg_done = 4
    level = 5
    level_timer = level_duration
    level5_text = "what's going on....?"
    win_flash = win_flash_duration
    boss_active = 0
    sword_interval = 99999999
end

 
 
  if bg_transitioning == 1 then
   
    bg_transition -= 2 // speed of transition
   
  if bg_transition <= 0 then
    bg_transition = 0
    current_background = next_background
    bg_transitioning = 0
    end
  end
 
  if bg_transitioning == 2 then
   
    bg_transition -= 2 // speed of transition
   
  if bg_transition <= 1 then
    bg_transition = 1
    current_background = next2_background
    bg_transitioning = 0
  end
 end
  if bg_transitioning == 3 then
   
    bg_transition -= 2 // speed of transition
   
  if bg_transition <= 1 then
    bg_transition = 1
    current_background = next3_background
    bg_transitioning = 0
  end
end

  if level_timer > 0 then
    level_timer -= 1
  end
  
  

 //boss tracks player
    if  player_x > boss_x then
      boss_x += 0.8
    elsif player_x < boss_x then
      boss_x -= 0.8
      end
    
  // restart
 
  if gameover >= 1 then
   
    if keyboard.SPACE then
      resetGame() 
    end
    return
    end
 
  // movement
  if keyboard.LEFT then
    player_x -=2
    player_dir = -1
    player_state = "move"
 
  elsif keyboard.RIGHT then
    player_x += 2
    player_dir = 1
    player_state = "move"

  else
    player_state = "idle"
 
  end
 
  // gravity
  player_vy -= gravity
  
  if player_vy < -6 then
    player_vy = -6
    end
    
  player_y += player_vy
 
  //animation
  if player_vy > 1 then
    player_anim = "jump"
  elsif player_vy < -1 then
    player_anim = "fall"
  else
    player_anim = "idle"
  end

  // platform collision
 for p in platforms

  if player_vy < 0 then // only when falling

    // horizontal check
    if abs(player_x - p.x) < 40 then

      // calculate player's bottom, height 40, half 20
      player_bottom = player_y - 20
      prev_bottom = player_y - player_vy - 20

      // check if we crossed the platform this frame
      if player_bottom <= p.y + 5 and prev_bottom >= p.y - 5 then

        // snap on top of platform
        player_y = p.y + 20
        respawn_x = p.x
        respawn_y = p.y + 20
        
        //normal
        if p.category == 1 then
          player_vy = jump_force 
       // breakable
        elsif p.category == 2 then
          p.y = camY - 300
          player_vy = 0
        // moving
        elsif p.category == 3 then
          player_vy = jump_force
        //dissapearing 
        elsif p.category == 4 then
          if p.used == 0 then
            player_vy = jump_force
            p.used = 1
            end
        // double jump
        elsif p.category == 5 then
          player_vy = jump_force * 2
        end
        
      if p.category == 1 then
        audio.playSound("jump", 0.4, 0.9)
      
      elsif p.category == 2 then
        audio.playSound("break", 2, 0.8)
        
      elsif p.category == 3 then
        audio.playSound("jump", 0.4, 0.9)
        
      elsif p.category == 4 then
        audio.playSound("whoosh", 0.4, 0.9)
        
      elsif p.category == 5 then 
        audio.playSound("boing", 0.4, 0.9)
      
      end

      end

    end

  end

 end
 
   for p in platforms 
     if p.category == 3 then
       p.x += p.dir * 1.5
       
       if p.x > 180 then p.dir = -1 
       end
       if p.x < -180 then p.dir = 1 
       end
     end
     
 

  //camera follows the player
  if level < 4 then
    if player_y > camY + 50 then 
      camY = player_y - 50 
    end

  else
    if player_y > camY + 10 then 
      camY = player_y - 10
    end
  end
  

  //respawn section 1 fixes positions
  if player_y > respawn_y then 
    respawn_y = player_y
  end
  

  //score
  if player_y > score then
    score = floor(player_y)
    end

  if score > best_score then
    best_score = score
    end
 

  //inf platforms
  for p in platforms

    if p.y < camY - 120 then

      gap = 10 + random.nextInt(10) + level * 5

      p.y = highest + gap
      p.x = random.nextInt(400) - 200
      p.used = 0
      p.dir = 1
      p.category = 1
      r = random.nextInt(100)
      
      if level == 1 then 
        p.category = 1
      elsif level == 2 then
        if r < 70 then 
          p.category = 1
        elsif r < 85 then 
            p.category = 2
        else 
          p.category = 3 
          end
      elsif level == 3 then
        if r < 50 then 
          p.category = 1
        elsif r < 65 then 
            p.category = 2
        elsif r < 80 then
            p.category = 3
        elsif r < 90 then 
          p.category = 4 
        else 
          p.category = 5
        end
      else
        if r < 30 then 
          p.category = 1
        elsif r < 45 then 
            p.category = 2
        elsif r < 60 then
            p.category = 3
        elsif r < 75 then
            p.category = 4
        else
          p.category = 5 
         end
      end
       
      if p.y > highest then
        highest = p.y
      end
      
    end
  end

 
  //game over and respawn section 2
  if player_y < camY - 160 then
    lives -= 1
    if lives > 0 then
      player_x = respawn_x
      player_y = respawn_y
      player_vy = jump_force * 0.8
      camY = player_y - 60
    else 
      gameover = 1
    end
    
  end
end

end
end

draw = function()
  screen.clear()
  if mode == "title" then
    drawTitlescreen()
  elsif mode == "play" then
    drawGame()
  end
end


   
drawGame = function()

  
  //switch background
  screen.drawMap(current_background, 0, 0, 640, 200)
 
  if bg_transitioning == 1 then
    screen.drawMap(next_background, 0, bg_transition, 640,200)
  end
 
  if bg_transitioning == 2 then
    screen.drawMap(next2_background, 0, bg_transition, 640,200)
  end
 
  if bg_transitioning == 3 then
    screen.drawMap(next3_background, 0, bg_transition, 640,200)
  end
 

  //game over screen
  if gameover == 1 then
    screen.setColor("#000")
    screen.drawText("GAME OVER", 0, 30, 25)
    screen.drawText("score: " + score, 0, 5, 15)
    screen.drawText("best: " + best_score, 0, -15, 12)
    screen.drawText("press SPACE", 0, -40, 12)
    return
  end
 
  if gameover == 2 then
    screen.drawMap("background5", 0, 0, 640, 200)
    screen.setColor("#000")
    screen.setFont("LycheeSoda")
    screen.drawText("Back home :) (You Won)", 0, 20, 40,"rgb(255,255,255)")
    screen.drawText("press SPACE to play again", 0, -20, 20,"rgb(255,255,255)")
    return
  end
 

  //platforms
  for p in platforms
    if p.used != 1 then
      
      if p.category == 1 then
        screen.drawSprite("platform", p.x, p.y - camY, 50, 15)
        
      elsif p.category == 2 then
        screen.drawSprite("platform_break", p.x, p.y - camY, 50, 15)
        
      elsif p.category == 3 then
        screen.drawSprite("platform_move", p.x, p.y - camY, 50, 15)
        
      elsif p.category == 4 then
        screen.drawSprite("platform_dspr", p.x, p.y - camY, 50, 15)
        
      elsif p.category == 5 then
        screen.drawSprite("platform_jump", p.x, p.y - camY, 50, 15)
        
      end
    end
  end

  // bossss
  if boss_active == 1 then
    screen.drawSprite("orig", boss_x, 80, 60, 60)
    end
   
   //swords
   for s in swords 
     screen.drawSprite("sword", s.x, s.y - camY, 150, 200)
   end
   
   
 
  //player
  if player_dir == -1 then
    screen.setDrawScale(-1, 1) // flips the guy on the x axis
 
  else
    screen.setDrawScale(1, 1)
   
  end
 
  screen.drawSprite("player_" + player_anim, player_x, player_y - camY, playerW, playerH)

  //reset the char after drawing
  screen.setDrawScale(1, 1)
 
  //lives
  screen.setColor("#000")
  screen.drawText("Lives: " + lives, -190, 80, 17)
  
  //score
  screen.setColor("#000")
  screen.drawText("score: " + score, -100, 80, 17)
 
  //level on top right
  screen.setColor("#000")
  screen.drawText("Level: " + level, 180, 80, 17)
 
  if level_timer > 0 then
    //progress (1 to 0)
    t = level_timer/level_duration
   
    // flash screen
    alpha = t ^ 0.5
   
    screen.setAlpha(alpha)
    screen.setColor("#FFF")
    screen.fillRect(0, 0, 700, 200)
    screen.setAlpha(1) // resets the flash
   
   
    // the text for new levels.
    size = 50 + (1 - t) * 20 // this makes the text go bigger
   
    screen.setColor("#000")
    if level_timer > 0 and win_flash == 0 then
    screen.drawText("LEVEL " + level, 0, 20, size)
    end
   
  end
 
  if win_flash > 0 then
   
    if win_flash > 60 then
      alpha = 1
       
    else
     alpha = win_flash / 60
   
      end
   
    screen.setAlpha(alpha)
    screen.setColor("#FFF")
    screen.fillRect(0, 0, 640, 200)
    screen.setAlpha(1)
    screen.setColor("#000")
    t = win_flash / win_flash_duration
    size = 30 + (1 - t) * 20
    shake = random.nextInt(6) - 3
    screen.drawText(level5_text, shake, 10, size)
   
  end
end
end()
